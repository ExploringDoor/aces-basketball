<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#840036">
<link rel="icon" href="/LM_Logo.png">
<title>Shoot-a-Thon | Lower Merion Aces Basketball</title>
<meta name="description" content="Sponsor an Aces player per made free throw, or make a one-time donation, in our Shoot-a-Thon.">
<meta property="og:title" content="Aces Shoot-a-Thon | Lower Merion Aces Basketball">
<meta property="og:description" content="Sponsor an Aces player per made free throw, or make a one-time donation.">
<meta property="og:image" content="https://www.aceshoops.com/og-image.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --mrn:#840036;--mrn-d:#6a002b;--mrn-50:#fbf2f5;--mrn-100:#f5e1e8;--gold:#c9a44a;--gold-d:#8a6a1e;--gold-50:#fbf6e9;
  --bg:#f5f5f7;--card:#fff;--ink:#16161a;--ink-2:#45454f;--ink-3:#767682;--line:#e6e6ea;--line-2:#d6d6dc;--ok:#1f8a4c;--ok-50:#e8f6ee;--err:#b42318;
  --r:18px;--sh:0 1px 2px rgba(20,20,30,.05),0 2px 8px rgba(20,20,30,.04);--sh-2:0 18px 50px rgba(20,20,30,.18)
}
html{scroll-behavior:smooth}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;font-size:16px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{max-width:100%}
.muted{color:var(--ink-3)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.container{max-width:1180px;margin:0 auto;padding:0 28px}
/* header */
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav .container{display:flex;align-items:center;justify-content:space-between;gap:16px;height:84px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:64px;width:auto}
.brand .t1{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:3px;color:var(--mrn);line-height:1}
.brand .t2{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:5px;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.nav .right{display:flex;align-items:center;gap:10px}
.navlink{font-weight:600;color:var(--ink-2);padding:10px 12px;border-radius:10px}
.navlink:hover{background:var(--bg);color:var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 28px;border-radius:12px;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:1px;text-transform:uppercase;background:var(--mrn);color:#fff;border:2px solid var(--mrn);cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .15s;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--mrn-d);border-color:var(--mrn-d)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:10px 18px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn.outline{background:#fff;color:var(--mrn);border-color:var(--mrn-100)}
.btn.outline:hover{border-color:var(--mrn);background:var(--mrn-50)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#221800}.btn.gold:hover{background:#b8933a;border-color:#b8933a}
.btn.plain{background:#fff;color:var(--ink);border:1px solid var(--line-2);font-family:'Source Sans 3',sans-serif;text-transform:none;letter-spacing:0;font-size:15px;padding:11px 16px}
.btn.plain:hover{border-color:var(--ink-3);background:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
/* match banner */
.matchbar{background:var(--gold);color:#221800;text-align:center;font-weight:700;padding:12px 20px;font-size:16px}
.alert{background:#fff7e6;border:1px solid #f1d9a6;color:#6b4a00;border-radius:14px;padding:14px 18px;margin:20px 0 0;font-weight:600}
/* hero */
.hero{background:#fff;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-180px;top:-200px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,74,.16),rgba(201,164,74,0) 65%)}
.hero .container{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:56px;padding-bottom:56px;position:relative}
.kicker{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--gold-d);font-size:14px}
.crumb{font-size:15px;color:var(--ink-3);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--mrn);font-weight:600}
.crumb a:hover{text-decoration:underline}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:76px;line-height:.98;letter-spacing:1px;text-transform:uppercase;color:var(--mrn);margin:10px 0 16px}
.lead{font-size:20px;color:var(--ink-2);max-width:560px;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:15px;color:var(--ink-2);font-weight:600}
.chip svg{width:16px;height:16px;color:var(--mrn)}
.chip b{color:var(--ink)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
/* goal card */
.goal{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-2);padding:30px 30px 26px}
.goal .lbl{font-family:'Oswald',sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:13px;color:var(--ink-3);font-weight:600}
.goal .raised{font-family:'Anton',sans-serif;font-size:64px;line-height:1;color:var(--ink);margin-top:8px}
.goal .of{color:var(--ink-2);margin-top:6px;font-size:17px}
.goal .of b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:22px;padding-top:18px;margin-bottom:22px}
.stats div{text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;line-height:1.1}
.stats span{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;font-weight:600}
/* progress */
.therm{height:14px;border-radius:999px;background:#ededf1;overflow:hidden;margin-top:18px}
.therm>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mrn),#b3134f);border-radius:999px;transition:width .9s ease}
.therm.met>i{background:linear-gradient(90deg,var(--ok),#34b36a)}
.therm.sm{height:9px;margin-top:12px}
.tnums{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:15px;color:var(--ink-3);gap:8px;flex-wrap:wrap}
.tnums b{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);font-size:19px}
.tnums .pct{font-family:'Oswald',sans-serif;font-weight:600;color:var(--mrn);font-size:17px}
.tnums .met{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ok);font-size:17px}
/* sections */
section.block{padding:64px 0}
section.block.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sh h2{font-family:'Anton',sans-serif;font-weight:400;font-size:42px;letter-spacing:1px;text-transform:uppercase;line-height:1;color:var(--ink)}
.sh p{color:var(--ink-3);font-size:17px;margin-top:8px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh)}
.step .no{width:46px;height:46px;border-radius:14px;background:var(--mrn-50);color:var(--mrn);font-family:'Anton',sans-serif;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.step h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:21px;margin-bottom:6px}
.step p{color:var(--ink-2)}
.step .ex{margin-top:12px;background:var(--gold-50);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--gold-d);font-weight:600}
/* team cards */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s,transform .15s;position:relative;overflow:hidden}
.tcard:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--mrn)}
.tcard:hover{border-color:var(--mrn-100);box-shadow:0 10px 30px rgba(132,0,54,.12);transform:translateY(-2px)}
.tcard h3{font-family:'Anton',sans-serif;font-weight:400;font-size:34px;letter-spacing:1px;text-transform:uppercase;line-height:1}
.tcard .sub{color:var(--ink-3);font-size:15px;margin-top:6px}
.tcard .go{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--mrn);font-weight:700}
.tcard .go svg{width:16px;height:16px}
/* players */
.ptools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.search{position:relative;flex:1;min-width:240px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-3)}
.search input{width:100%;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:15px 16px 15px 46px;font-size:17px;font-family:inherit;color:var(--ink);outline:none}
.search input:focus{border-color:var(--mrn);box-shadow:0 0 0 4px var(--mrn-100)}
.fchip{appearance:none;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer}
.fchip:hover{border-color:var(--ink-3)}
.fchip[aria-pressed="true"]{background:var(--mrn);border-color:var(--mrn);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s,transform .15s}
.pcard:hover{border-color:var(--mrn-100);box-shadow:0 10px 30px rgba(132,0,54,.12);transform:translateY(-2px)}
.pcard .top{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--mrn),#a8184f);color:#fff;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 3px rgba(201,164,74,.55)}
.pcard .nm{font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;line-height:1.2}
.pcard .tm{color:var(--ink-3);font-size:14px}
.pcard .grow{flex:1}
.pcard .go{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--mrn-50);color:var(--mrn);border-radius:10px;padding:11px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:14px;transition:background .15s,color .15s}
.pcard:hover .go{background:var(--mrn);color:#fff}
.none{background:#fff;border:1px dashed var(--line-2);border-radius:var(--r);padding:40px;text-align:center;color:var(--ink-3);grid-column:1/-1}
/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:26px}
.panel h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;margin-bottom:4px}
.panel .ps{color:var(--ink-3);margin-bottom:16px}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow:hover .lname{color:var(--mrn)}
.rank{width:34px;height:34px;border-radius:10px;background:var(--bg);font-family:'Oswald',sans-serif;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2)}
.rank.r1{background:var(--gold);color:#221800}.rank.r2{background:#dfe1e6}.rank.r3{background:#ecd3bf}
.lname{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname small{display:block;font-weight:400;color:var(--ink-3);font-size:14px}
.lamt{font-family:'Oswald',sans-serif;font-weight:600;font-size:19px}
.srow{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}
.srow:first-of-type{border-top:0}
.sav{width:40px;height:40px;border-radius:50%;background:var(--mrn-50);color:var(--mrn);font-family:'Oswald',sans-serif;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.srow .who{font-weight:700}
.srow .who span{font-weight:400;color:var(--ink-3)}
.srow .msg{color:var(--ink-2);font-style:italic;margin-top:2px}
.empty-note{color:var(--ink-3);padding:10px 0}
/* about + faq */
.about{font-size:18px;color:var(--ink-2);white-space:pre-wrap;line-height:1.65;max-width:820px}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-family:'Oswald',sans-serif;font-size:26px;color:var(--mrn);line-height:1;flex:none}
.faq details[open] summary:after{content:"\2212"}
.faq p{color:var(--ink-2);padding:0 0 20px;max-width:800px}
/* player page */
.phero .container{grid-template-columns:1fr 1fr}
.pbig{display:flex;align-items:center;gap:22px;margin-bottom:8px}
.pbig .av{width:104px;height:104px;font-size:40px}
.pbig h1{font-size:64px;margin:6px 0 0}
.quote{background:var(--gold-50);border-left:4px solid var(--gold);border-radius:12px;padding:16px 20px;font-size:18px;color:var(--ink-2);margin-top:20px;font-style:italic}
.share{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.linkbox{display:flex;gap:8px;margin-bottom:14px}
.linkbox input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink-2);font-family:inherit}
.sbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sbtns .btn.plain{width:100%}
#qrbox{background:#fff;padding:12px;border:1px solid var(--line);border-radius:14px;display:inline-block}
#qrbox img,#qrbox canvas{display:block}
.qr{text-align:center}
.qr .btn{margin-top:10px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,30,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:200}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:22px;max-width:520px;width:100%;padding:30px 30px 26px;box-shadow:var(--sh-2);position:relative}
.mclose{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:#fff;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.mclose:hover{border-color:var(--ink-3)}
.mclose svg{width:18px;height:18px}
.modal .kicker{font-size:12px}
.modal h2{font-family:'Anton',sans-serif;font-weight:400;font-size:34px;text-transform:uppercase;letter-spacing:.5px;line-height:1.05;margin:6px 48px 6px 0;color:var(--ink)}
.modal .msub{color:var(--ink-3);margin-bottom:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.seg button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 10px;color:var(--ink-2);cursor:pointer;font-weight:700;font-size:16px;text-align:center}
.seg button .s-sub{display:block;font-weight:400;font-size:13px;color:var(--ink-3);margin-top:2px}
.seg button[aria-pressed="true"]{border-color:var(--mrn);background:var(--mrn-50);color:var(--mrn)}
.fg{margin-bottom:16px}
.fg>label,.row2 label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:6px;font-weight:700}
.inp{width:100%;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:13px 14px;color:var(--ink);font-family:inherit;font-size:17px;outline:none}
.inp:focus{border-color:var(--mrn);box-shadow:0 0 0 4px var(--mrn-100)}
.money-in{position:relative}.money-in .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:600}.money-in .inp{padding-left:28px}
.row2{display:flex;gap:12px}.row2>*{flex:1;min-width:0}
.est{background:var(--bg);border-radius:12px;padding:13px 15px;font-size:15px;color:var(--ink-2);margin-bottom:16px}.est b{color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.quick button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 4px;color:var(--ink);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;font-size:19px}
.quick button:hover{border-color:var(--mrn-100)}
.quick button.on{border-color:var(--mrn);background:var(--mrn-50);color:var(--mrn)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--ink-2);cursor:pointer;margin-bottom:16px}.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--mrn);flex:none}
.err{color:var(--err);font-size:15px;margin-top:10px;min-height:1.2em;font-weight:600}
.fine{color:var(--ink-3);font-size:13px;margin-top:12px;text-align:center;display:flex;gap:6px;align-items:center;justify-content:center}
.fine svg{width:14px;height:14px}
.done{text-align:center;padding:10px 0}
.done .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-50);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done .ic svg{width:36px;height:36px}
.done h2{margin-right:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}.therm>i{transition:none}.pcard,.tcard{transition:none}}
/* closed / loading */
.closed{max-width:640px;margin:80px auto;text-align:center;padding:0 20px}
.closed img{height:120px;width:auto;margin-bottom:16px}
.closed h1{font-size:64px}
/* trust + footer */
.trust{background:#fff;border-top:1px solid var(--line)}
.trust .container{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-top:36px;padding-bottom:36px}
.trust .t{display:flex;gap:14px;align-items:flex-start}
.trust .t .i{width:44px;height:44px;border-radius:12px;background:var(--mrn-50);color:var(--mrn);display:flex;align-items:center;justify-content:center;flex:none}
.trust .t .i svg{width:22px;height:22px}
.trust b{display:block;font-size:16px}
.trust span{color:var(--ink-3);font-size:15px}
.trust a{color:var(--mrn);font-weight:600}
footer{text-align:center;padding:26px 16px 34px;font-size:14px;color:var(--ink-3)}
footer a{text-decoration:underline}
@media(max-width:1060px){.pgrid{grid-template-columns:repeat(3,1fr)}h1{font-size:62px}.goal .raised{font-size:54px}}
@media(max-width:860px){
  .hero .container,.phero .container{grid-template-columns:1fr;gap:30px;padding-top:36px;padding-bottom:36px}
  .steps,.tgrid,.two,.trust .container{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .share{grid-template-columns:1fr}
}
@media(max-width:560px){
  .container{padding:0 16px}
  .nav .container{height:70px}.brand img{height:50px}.brand .t1{font-size:22px}.brand .t2{font-size:10px;letter-spacing:3px}
  .navlink{display:none}

<script>
function $(id){ return document.getElementById(id); }
function qs(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function money(c){ var v=(c||0)/100; return '$'+(v%1===0?v.toLocaleString('en-US'):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})); }
function dollarsToCents(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); if(!isFinite(n)||n<0) return null; return Math.round(n*100); }
function ic(id){ return '<svg aria-hidden="true"><use href="#'+id+'"/></svg>'; }
function nowrapWords(t){ return String(t).split(/\s+/).map(function(w){ return '<span style="white-space:nowrap">'+esc(w)+'</span>'; }).join(' '); }
function initials(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }

var ERR_PARAMS={ notready:"That donation link isn't ready yet. We'll email it after the event.", notfound:"We couldn't find that donation. Try again below.", payfail:"Something went wrong starting your payment. Please try again.", unavailable:"Online payment isn't available right now. Please try again soon.", badlink:"That link looks incomplete." };

function teamName(slug){ var t=(CFG.teams||[]).find(function(x){return x.slug===slug;}); return t?t.name:''; }

function playerBy(slug){ return (CFG.players||[]).find(function(x){return x.slug===slug;})||null; }
function playersOf(teamSlug){ return (CFG.players||[]).filter(function(p){return p.team===teamSlug;}); }

function therm(raised,goal,small){
  var met=goal>0&&(raised||0)>=goal;
  var pct=goal>0?Math.min(100,Math.round((raised||0)/goal*100)):0;
  return '<div class="therm'+(small?' sm':'')+(met?' met':'')+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="tnums"><span><b>'+money(raised||0)+'</b> raised</span>'+(goal>0?(met?'<span class="met">Goal reached</span>':'<span><span class="pct">'+pct+'%</span> of '+money(goal)+'</span>'):'')+'</div>';
}
function goalCard(raised,goal,stats,btnHtml){
  var met=goal>0&&(raised||0)>=goal, pct=goal>0?Math.min(100,Math.round((raised||0)/goal*100)):0;
  return '<div class="goal"><div class="lbl">Raised so far</div><div class="raised">'+money(raised||0)+'</div>'+
    '<div class="of">'+(goal>0?(met?'<b>Goal reached!</b> The goal was '+money(goal)+'.':'<b>'+pct+'%</b> of the <b>'+money(goal)+'</b> goal'):'Every gift counts')+'</div>'+
    '<div class="therm'+(met?' met':'')+'"><i style="width:'+pct+'%"></i></div>'+
    (stats&&stats.length?'<div class="stats">'+stats.map(function(s){ return '<div><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'; }).join('')+'</div>':'<div style="height:22px"></div>')+
    btnHtml+'</div>';
}
function countdownChip(){
  if(!CFG.event_date) return '';

  var dateStr=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var days=Math.ceil((d-new Date())/86400000);
  var label=days>1?days+' days to go':days===1?'Tomorrow':days===0?'Today':'';
  return '<span class="chip">'+ic('i-cal')+esc(dateStr)+(label?' &middot; <b>'+label+'</b>':'')+'</span>';
}
function supporterChip(){ var n=CFG.supporter_count||0; return n?'<span class="chip">'+ic('i-users')+'<b>'+n+'</b> supporter'+(n===1?'':'s')+'</span>':''; }

function recentPanel(filter,title){
  var list=(CFG.recent||[]).filter(function(r){
    if(!filter) return true;
    if(filter.type==='player') return r.target_type==='player'&&r.target_slug===filter.slug;
    if(filter.type==='team'){ if(r.target_type==='team'&&r.target_slug===filter.slug) return true; if(r.target_type==='player'){ var p=playerBy(r.target_slug); return p&&p.team===filter.slug; } return false; }
    return true;
  });
  var rows=list.slice(0,10).map(function(r){
    return '<div class="srow"><div class="sav">'+esc(r.name==='Anonymous'?'?':initials(r.name))+'</div><div><div class="who">'+esc(r.name)+(filter&&filter.type==='player'?'':' <span>backed '+esc(r.backs)+'</span>')+'</div>'+(r.message?'<div class="msg">&ldquo;'+esc(r.message)+'&rdquo;</div>':'')+'</div></div>';

  var rows=list.map(function(p,i){ return '<a class="lrow" href="?player='+encodeURIComponent(p.slug)+'"><span class="rank'+(i<3?' r'+(i+1):'')+'">'+(i+1)+'</span><span class="lname">'+esc(p.name)+(teamName(p.team)?'<small>'+esc(teamName(p.team))+'</small>':'')+'</span><span class="lamt">'+money(p.raised_cents)+'</span></a>'; }).join('');
  return '<div class="panel"><h3>'+(title||'Top fundraisers')+'</h3><div class="ps">The players leading the way.</div>'+(rows||'<div class="empty-note">No gifts yet. Yours could put a player on top.</div>')+'</div>';
}
function playerCard(p){

}
function stepsBlock(){
  return '<section class="block alt"><div class="container"><div class="sh"><div><h2>How it works</h2><p>Two easy ways to give. Both count toward the player, their team and the whole program.</p></div></div>'+

    '<div class="t"><div class="i">'+ic('i-heart')+'</div><div><b>100% to the Aces</b><span>Collected by Always Competing Sports LLC for '+esc(CFG.booster_name||'the Lower Merion Boys Basketball team')+' and passed along in full.</span></div></div>'+
    '<div class="t"><div class="i">'+ic('i-mail')+'</div><div><b>Questions?</b><span>Email <a href="mailto:aceshoops@gmail.com">aceshoops@gmail.com</a></span></div></div>'+
  '</div></section>';
}

      (teams.length>1?'<button class="fchip" type="button" data-tf="" aria-pressed="true">All</button>'+teams.map(function(t){ return '<button class="fchip" type="button" data-tf="'+esc(t.slug)+'" aria-pressed="false">'+esc(t.name)+'</button>'; }).join(''):'')+
      '</div><div class="pgrid" id="searchResults"></div></div></section>';

  Array.prototype.forEach.call(document.querySelectorAll('[data-tf]'),function(b){ b.addEventListener('click',function(){ TEAM_FILTER=b.getAttribute('data-tf'); Array.prototype.forEach.call(document.querySelectorAll('[data-tf]'),function(x){ x.setAttribute('aria-pressed',String(x===b)); }); runSearch(); }); });

function runSearch(){

function shareBlock(name,link,text,email){

        '<a class="btn plain" href="sms:?&body='+encodeURIComponent(text)+'">'+ic('i-sms')+'Text it</a>'+
        (email?'<button class="btn plain" type="button" data-copy="email">'+ic('i-mail')+'Copy an email</button>':'')+
        '<button class="btn plain" type="button" data-copy="text">'+ic('i-copy')+'Copy a text</button>'+
        '<button class="btn plain" type="button" id="nativeShare" style="display:none">'+ic('i-share')+'More options</button>'+
      '</div></div>'+
      '<div class="qr"><div id="qrbox"></div><div><button class="btn plain" type="button" id="dlQr">'+ic('i-dl')+'Download QR code</button></div></div>'+
    '</div></div></section>';
}
function wireShare(tmpl,title,fileBase){
  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'),function(b){ b.addEventListener('click',function(){ copyText(tmpl[b.getAttribute('data-copy')], b); }); });
  if(navigator.share){ var ns=$('nativeShare'); ns.style.display=''; ns.addEventListener('click',function(){ navigator.share({title:title,text:tmpl.text,url:tmpl.url}).catch(function(){}); }); }
  // QR code (library loaded from cdnjs; degrade gracefully if blocked)
  if(window.QRCode){ try{ new QRCode($('qrbox'),{text:tmpl.url,width:150,height:150,colorDark:'#16161a',colorLight:'#ffffff'}); }catch(e){} }
  if(!$('qrbox').firstChild){ $('qrbox').parentNode.style.display='none'; }
  else { $('dlQr').addEventListener('click',function(){ var cv=$('qrbox').querySelector('canvas'); var img=$('qrbox').querySelector('img'); var url=cv?cv.toDataURL('image/png'):(img?img.src:''); if(!url) return; var a=document.createElement('a'); a.href=url; a.download=fileBase+'-shootathon-qr.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }); }
}

function slugText(s){ return String(s).replace(/\s+/g,'-').toLowerCase(); }

function renderPlayer(slug){
  var p=playerBy(slug); if(!p){ renderOrg(); return; }
  var tn=teamName(p.team), first=String(p.name).split(' ')[0];
  var h='<section class="hero phero"><div class="container"><div>'+
      '<div class="crumb"><a href="?">Shoot-a-Thon</a>'+(tn?'<span>/</span><a href="?team='+encodeURIComponent(p.team)+'">'+esc(tn)+'</a>':'')+'<span>/</span><span>'+esc(p.name)+'</span></div>'+
      '<div class="pbig"><div class="av">'+esc(initials(p.name))+'</div><div><div class="kicker">'+(tn?esc(tn)+' &middot; ':'')+'Shoot-a-Thon</div><h1>'+esc(p.name)+'</h1></div></div>'+
      (p.blurb?'<div class="quote">&ldquo;'+esc(p.blurb)+'&rdquo;</div>':'<p class="lead" style="margin-top:14px">Sponsor '+esc(first)+' for every free throw made at the Shoot-a-Thon, or give once right now.</p>')+
      '<div class="chips">'+countdownChip()+'</div>'+
    '</div>'+
    goalCard(p.raised_cents,p.goal_cents,null,'<button class="btn full" type="button" onclick="openDonate(\'player\',\''+esc(p.slug)+'\')">Sponsor '+esc(first)+' '+ic('i-arrow')+'</button><p class="muted" style="font-size:14px;margin-top:12px;text-align:center">Pledge per made free throw (paid after the event), or give once now.</p>')+
  '</div></section>';
  var link=location.origin+location.pathname+'?player='+encodeURIComponent(p.slug);
  var tmpl={
    url:link,
    email:"Hi Friends and Family,\n\nI'm part of the Lower Merion Aces and I'll be shooting free throws in our team's Shoot-a-Thon! You can sponsor me per MADE free throw (anything from $0.25 to $10) or make a one-time donation.\n\nClick my link to pledge: "+link+"\n\nPlease help me reach my goal. I'll be practicing!\n\nThanks,\n"+p.name,
    text:"Hi! I'm shooting in the Lower Merion Aces Shoot-a-Thon. Sponsor me per made free throw or donate here: "+link
  };
  h+=shareBlock(first+"'s page",link,tmpl.text,true);
  h+='<section class="block"><div class="container"><div class="two">'+recentPanel({type:'player',slug:slug},esc(first)+'\'s supporters')+
    '<div class="panel"><h3>How sponsoring works</h3><div class="ps">Two ways to back '+esc(first)+'.</div>'+
      '<div class="srow"><div class="sav">1</div><div><div class="who">Per made free throw</div><div class="msg" style="font-style:normal">Pick an amount per make, like $0.50. After the event you get an email with your exact total.</div></div></div>'+
      '<div class="srow"><div class="sav">2</div><div><div class="who">One time gift</div><div class="msg" style="font-style:normal">Any amount from $5, paid by card today.</div></div></div>'+
      '<button class="btn full" type="button" style="margin-top:16px" onclick="openDonate(\'player\',\''+esc(p.slug)+'\')">Sponsor '+esc(first)+'</button>'+
    '</div></div></div></section>';
  $('wrap').innerHTML=h;
  wireShare(tmpl,p.name+' | Aces Shoot-a-Thon',slugText(p.name));
}

function copyText(txt,btn){
  var done=function(){ var o=btn.innerHTML; btn.innerHTML=ic('i-check')+'Copied'; setTimeout(function(){btn.innerHTML=o;},1500); };
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done,function(){ fallbackCopy(txt);done(); }); }
  else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){ var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }

// ── Donate modal ────────────────────────────────────────────────────────
var MODAL={ type:'org', slug:'', kind:'flat', name:'' };
var CLOSE='<button class="mclose" type="button" onclick="closeModal()" aria-label="Close">'+ic('i-x')+'</button>';
function openDonate(type,slug){
  MODAL.type=type; MODAL.slug=slug;
  MODAL.name = type==='player'?(playerBy(slug)||{}).name : type==='team'?teamName(slug) : 'the whole program';
  MODAL.kind = type==='player' ? 'per_shot' : 'flat';
  renderModal();
  $('modalBg').classList.add('on');
  setTimeout(function(){ var f=$('modal').querySelector('#quick button'); if(f) f.focus(); },60);
}
function closeModal(){ $('modalBg').classList.remove('on'); }
function setMKind(k){ MODAL.kind=k; renderModalFields(); }

function renderModal(){
  var isPlayer=MODAL.type==='player';
  var h=CLOSE+'<div class="kicker">Aces Shoot-a-Thon</div>'+
    '<h2>Support '+esc(MODAL.name)+'</h2>'+
    '<p class="msub">'+(isPlayer?'Sponsor per made free throw, or give a one time donation.':'Make a one time donation. It counts toward '+esc(MODAL.name)+(MODAL.type==='team'?" and the program's":"")+' goal.')+'</p>';
  if(isPlayer){
    h+='<div class="seg" id="mSeg">'+
       '<button type="button" data-k="per_shot">Per made free throw<span class="s-sub">Paid after the event</span></button>'+
       '<button type="button" data-k="flat">One time gift<span class="s-sub">Pay now</span></button>'+
       '</div>';
  }
  h+='<form id="dform" novalidate><div class="hp"><input type="text" name="dba_ref" tabindex="-1" autocomplete="off"></div><div id="mFields"></div>'+
     '<div class="row2"><div class="fg"><label for="dname">Your name</label><input class="inp" id="dname" autocomplete="name"></div><div class="fg"><label for="demail">Email</label><input class="inp" id="demail" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com"></div></div>'+
     '<div class="fg"><label for="dmsg">Message <span class="muted" style="font-weight:400">(optional)</span></label><input class="inp" id="dmsg" maxlength="280" placeholder="Go get them!"></div>'+
     '<label class="check"><input type="checkbox" id="danon"><span>Give anonymously (hide my name on the public list)</span></label>'+
     '<button class="btn full" id="dsubmit" type="submit">Continue</button>'+
     '<div class="err" id="derr" role="alert"></div>'+
     '<p class="fine">'+ic('i-lock')+'Secure checkout by Stripe. Collected and passed along in full by Always Competing Sports LLC.</p>'+
     '</form>';
  $('modal').innerHTML=h;
  if(isPlayer) Array.prototype.forEach.call(document.querySelectorAll('#mSeg button'),function(b){ b.addEventListener('click',function(){ setMKind(b.getAttribute('data-k')); }); });
  $('dform').addEventListener('submit',submitDonate);
  renderModalFields();
}
function renderModalFields(){
  if(MODAL.type==='player') Array.prototype.forEach.call(document.querySelectorAll('#mSeg button'),function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-k')===MODAL.kind)); });
  var feeLabel='<label class="check"><input type="checkbox" id="coverFee"><span>'+(MODAL.kind==='per_shot'?'Also cover the card fee (about 3%) so 100% reaches the Aces. It\'s added to your total after the event.':'Add the card fee (about 3%) so <b>100% of my gift</b> reaches the Aces')+'</span></label>';
  var h='';
  if(MODAL.kind==='per_shot'){
    h='<div class="quick" id="quick">'+[25,50,100,200].map(function(c){return '<button type="button" data-amt="'+c+'">'+money(c)+'</button>';}).join('')+'</div>'+
      '<div class="row2"><div class="fg"><label for="perShot">Per made free throw</label><div class="money-in"><span class="pre">$</span><input class="inp" id="perShot" inputmode="decimal" placeholder="0.50"></div></div>'+
      '<div class="fg"><label for="cap">Cap <span class="muted" style="font-weight:400">(optional)</span></label><div class="money-in"><span class="pre">$</span><input class="inp" id="cap" inputmode="decimal" placeholder="No limit"></div></div></div>'+
      '<div class="est" id="est">Pick an amount to see an estimate.</div>'+feeLabel;
  } else {
    h='<div class="quick" id="quick">'+[2500,5000,10000,25000].map(function(c){return '<button type="button" data-amt="'+c+'">'+money(c)+'</button>';}).join('')+'</div>'+
      '<div class="fg"><label for="flat">Or enter an amount</label><div class="money-in"><span class="pre">$</span><input class="inp" id="flat" inputmode="decimal" placeholder="50"></div></div>'+
      feeLabel+'<div class="est" id="charged" style="display:none"></div>';
  }
  $('mFields').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(b){ b.addEventListener('click',function(){
    var c=parseInt(b.getAttribute('data-amt'),10);
    if(MODAL.kind==='per_shot'){ $('perShot').value=(c/100); mEst(); } else { $('flat').value=(c/100); mCharged(); }
    Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(x){ x.classList.toggle('on',x===b); });
  }); });
  var cf=$('coverFee'); if(cf) cf.addEventListener('change', MODAL.kind==='per_shot'?mEst:mCharged);
  var sub=$('dsubmit');
  if(MODAL.kind==='per_shot'){ sub.textContent='Make my pledge'; ['perShot','cap'].forEach(function(id){ $(id).addEventListener('input',function(){ clearQuick(); mEst(); }); }); mEst(); }
  else { sub.innerHTML='Continue to payment '+ic('i-arrow'); $('flat').addEventListener('input',function(){ clearQuick(); mCharged(); }); }
}
function clearQuick(){ Array.prototype.forEach.call(document.querySelectorAll('#quick button'),function(x){ x.classList.remove('on'); }); }
function feeCents(base){ if(!base||base<=0) return 0; var charged=Math.ceil((base+30)/(1-0.029)); return Math.max(0,charged-base); }
function mCharged(){
  var base=dollarsToCents($('flat').value), cf=$('coverFee')&&$('coverFee').checked, box=$('charged');
  if(!base){ box.style.display='none'; return; }
  var fee=cf?feeCents(base):0;
  box.style.display='block';
  box.innerHTML="You'll be charged <b>"+money(base+fee)+'</b>'+(fee>0?' ('+money(base)+' gift plus '+money(fee)+' fee)':'')+'.';
}
function mEst(){
  var per=dollarsToCents($('perShot').value), cap=dollarsToCents($('cap').value);
  if(!per){ $('est').innerHTML='Pick an amount to see an estimate.'; return; }
  var ex=100, raw=per*ex, capped=(cap&&cap>0)?Math.min(raw,cap):raw;
  var cf=$('coverFee')&&$('coverFee').checked;
  $('est').innerHTML='If '+esc(MODAL.name)+' makes <b>'+ex+'</b> free throws, that\'s <b>'+money(capped)+'</b>'+((cap&&cap>0)?' (capped at '+money(cap)+')':'')+'. You only pay for throws made.'+(cf?' Plus about 3% to cover the card fee.':'');
}
function mErr(m){ $('derr').textContent=m||''; }

function submitDonate(e){
  e.preventDefault(); mErr('');
  var name=$('dname').value.trim(), email=$('demail').value.trim();
  if(!name) return mErr('Please enter your name.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return mErr('Please enter a valid email.');
  var payload={ dba_ref:(document.querySelector('[name=dba_ref]').value||'').trim(), kind:MODAL.kind, target_type:MODAL.type, target_slug:MODAL.slug, donor_name:name, donor_email:email, message:$('dmsg').value.trim(), anonymous:$('danon').checked, cover_fee:($('coverFee')&&$('coverFee').checked)?true:false };
  if(MODAL.kind==='per_shot'){
    var per=dollarsToCents($('perShot').value);
    if(!per||per<LIMITS.minPerShot) return mErr('Enter at least $0.25 per made free throw.');
    var cap=dollarsToCents($('cap').value);
    payload.per_shot_cents=per;
    if(cap&&cap>0){ if(cap<per) return mErr('Your cap should be at least '+money(per)+'.'); payload.cap_cents=cap; }
  } else {
    var flat=dollarsToCents($('flat').value);
    if(!flat||flat<LIMITS.minFlat) return mErr('Enter at least $5.');
    payload.flat_cents=flat;
  }
  var btn=$('dsubmit'), old=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Working';
  if(DEMO){ setTimeout(function(){ btn.disabled=false; btn.innerHTML=old; demoDone(payload); },500); return; }
  fetch('/api/pledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){ return r.json().then(function(d){ return {status:r.status,d:d}; }); })
    .then(function(res){
      var d=res.d||{};
      if(res.status===200 && d.pay && d.url){ window.location.href=d.url; return; }       // pay now
      if(res.status===200 && d.pledged){ btn.disabled=false; btn.innerHTML=old; pledgedDone(payload); return; }
      btn.disabled=false; btn.innerHTML=old;
      var map={ closed:'Donations are closed right now.', too_many:'That is a lot of pledges in a short time. Please wait a while and try again.', unknown_player:'That player isn\'t in this event.', unknown_team:'That team isn\'t in this event.', bad_amount:'Please enter a valid amount.', bad_per_shot:'Enter at least $0.25 per made free throw.', not_configured:'Payments aren\'t available right now. Please try again soon.', checkout_failed:'Couldn\'t start payment. Please try again.' };
      mErr(map[d.error]||'Sorry, something went wrong. Please try again.');
    })
    .catch(function(){ btn.disabled=false; btn.innerHTML=old; mErr('Network error. Please try again.'); });
}
function pledgedDone(payload){
  try{ if(!DEMO && window.gtag) gtag('event','pledge',{method:'per_shot'}); }catch(e){}
  $('modal').innerHTML=CLOSE+'<div class="done"><div class="ic">'+ic('i-check')+'</div>'+
    '<h2>Pledge received. Thank you!</h2>'+
    '<p class="msub" style="margin-top:6px">Thanks for sponsoring <b>'+esc(MODAL.name)+'</b>! We\'ll count every made free throw, then email <b>'+esc(payload.donor_email)+'</b> a secure link for your exact total. Nothing has been charged yet.</p>'+
    '<button class="btn" type="button" onclick="closeModal()">Done</button></div>';
}
function demoDone(payload){
  if(payload.kind==='flat'){ $('modal').innerHTML=CLOSE+'<div class="done"><div class="ic">'+ic('i-lock')+'</div><h2>Demo</h2><p class="msub">On the real page this opens secure Stripe checkout to pay '+money(payload.flat_cents)+' now.</p><button class="btn" type="button" onclick="closeModal()">Close</button></div>'; }
  else pledgedDone(payload);
}

// ── Boot / router ─────────────────────────────────────────────────────────
function route(){
  var nd=$('navDonate');
  if(!CFG||!CFG.open){
    nd.style.display='none';
    $('wrap').innerHTML='<div class="closed"><img src="/LM_Logo.png" alt=""><div class="kicker">Shoot-a-Thon</div><h1>Coming soon</h1><p class="lead" style="margin:0 auto">Our Shoot-a-Thon isn\'t open just yet. Check back soon. Questions? <a href="mailto:aceshoops@gmail.com" style="color:var(--mrn);font-weight:600">aceshoops@gmail.com</a></p></div>';
    return;
  }
  var player=qs('player'), team=qs('team');
  if(player&&playerBy(player)){ renderPlayer(player); nd.onclick=function(){ openDonate('player',player); }; }
  else if(team&&teamBy(team)){ renderTeam(team); nd.onclick=function(){ openDonate('team',team); }; }
  else { renderOrg(); nd.onclick=function(){ openDonate('org',''); }; }
  var top=$('top'); top.innerHTML='';
  if(CFG.match_text){ var mb=document.createElement('div'); mb.className='matchbar'; mb.textContent=CFG.match_text; top.appendChild(mb); }
  var e=qs('e'); if(e&&ERR_PARAMS[e]){ var b=document.createElement('div'); b.className='container'; b.innerHTML='<div class="alert" role="alert">'+esc(ERR_PARAMS[e])+'</div>'; top.appendChild(b); }
  $('wrap').insertAdjacentHTML('beforeend',trustBlock());
}

document.addEventListener('DOMContentLoaded',function(){
  $('modalBg').addEventListener('click',function(e){ if(e.target===$('modalBg')) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
  if(qs('demo')==='1'){ DEMO=true; CFG=DEMO_CFG; route(); return; }
  fetch('/api/pledge').then(function(r){return r.json();}).then(function(c){ CFG=c||{open:false}; route(); }).catch(function(){ CFG={open:false}; route(); });
});
